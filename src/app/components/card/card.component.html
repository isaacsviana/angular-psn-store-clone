<a href="#" class="card__container">
	<img
		class="card__img"
		[src]=[gameCover]
		alt=""
		srcset=""
	>
	<app-card-label
		gameLabel="{{gameLabel}}"
	>
	</app-card-label>
	<app-card-pricing
		gameType="{{gameType}}"
		gamePrice="{{gamePrice}}"
	>
	</app-card-pricing>

	<button class="card__add-cart" (click)="onAddToCart($event)">
		+ Adicionar ao carrinho
	</button>
</a>
